[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/portal/auth"
  to = "/.netlify/functions/portal-auth"
  status = 200

[[redirects]]
  from = "/api/portal/data"
  to = "/.netlify/functions/portal-data"
  status = 200

[[redirects]]
  from = "/api/portal/logout"
  to = "/.netlify/functions/portal-logout"
  status = 200

[[headers]]
  for = "/portal/*"
  [headers.values]
    Cache-Control = "no-store"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
